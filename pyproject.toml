[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-email-detection"
version = "1.0.0"
description = "Reproducible comparison of NLP, zero-shot and retrieved four-shot phishing-email detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lingua-language-detector==2.1.1",
  "pyarrow==25.0.0",
  "scikit-learn==1.9.0",
  "spacy==3.8.14",
  "xx-ent-wiki-sm @ https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.9,<4",
  "nbconvert>=7.16,<8",
  "pandas>=2.2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
